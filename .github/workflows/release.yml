name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        run: make

      - name: package
        run: zip -j Gravepowder.3dsx.zip Gravepowder.3dsx

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Gravepowder ${{ github.ref_name }}
          body: |
            Gravepowder - a 3D zombie shooter for the Nintendo 3DS.

            Anthro wolf gunslinger, flintlock-era iron, shambling rot, and a valley
            split into zones you clear one yard at a time. Third/first person toggle.

            - real 3D rendering (citro3d) with a citro2d touch HUD
            - flintlock pistol, revolver and musket; zombie shamblers, runners, brutes
            - zone quests: clear the yard, bring back the drop
            - all art, meshes and sound generated by code in this repo

            Download `Gravepowder.3dsx` (or the zip), copy it to the `/3ds/` folder on your
            SD card, then launch it from the Homebrew Launcher.
          files: |
            Gravepowder.3dsx
            Gravepowder.3dsx.zip
